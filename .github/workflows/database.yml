name: Database migrations
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-database
  cancel-in-progress: false
jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    environment: database-production
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LOCAL_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply committed PostgreSQL migrations
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: npm run db:migrate
