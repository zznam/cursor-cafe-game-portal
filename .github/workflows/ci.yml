name: Quality gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.LOCAL_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        with:
          name: security-unit-coverage
          path: coverage/lcov.info
          retention-days: 14
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium-desktop --project=chromium-mobile
        env:
          CI: 'true'
          E2E_MOCK_DATABASE: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: playwright-report
          retention-days: 7
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.7'
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/aws init -backend=false
      - run: terraform -chdir=infra/aws validate
      - run: terraform -chdir=infra/aws/bootstrap init -backend=false
      - run: terraform -chdir=infra/aws/bootstrap validate
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: cafe:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container liveness and non-root user
        run: |
          docker run -d --name cafe-ci -p 3000:3000 cafe:ci
          test "$(docker exec cafe-ci id -u)" != "0"
          for attempt in $(seq 1 20); do
            if curl --fail http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs cafe-ci
          exit 1
